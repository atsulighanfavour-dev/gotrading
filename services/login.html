<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gotrading: Login</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/header.css" />
    <link rel="stylesheet" href="../css/footer.css" />
    <link rel="stylesheet" href="../css/login_form.css" />
    <script src="../js/header.js" defer></script>
    <script src="../js/footer.js" defer></script>
  </head>
  <body>
    <header>
     <div id="header"></div>
    </header>
    <section>
      <div class="form_background">
        <div class="form_container">
          <h2 class="form_logo">Gotrading</h2>

          <p class="subtitle">Sign into your account</p>

          <form action="post">
            <div class="input-box">
              <input
                class="login_input"
                type="email"
                placeholder="Email"
                required
              />
              <i id="login_font" class="fa-solid fa-user"></i>
            </div>
            <div class="input-box">
              <input
                class="login_input"
                type="password"
                placeholder="Password"
                required
              />
              <i id="login_font" class="fa-solid fa-lock"></i>
            </div>
            <a class="forgot-password" href="#">Forgot password?</a>
            <button type="submit" class="sign_in_btn">Sign in</button>
            <p class="sign_up">
              Don't have an account?<a class="sign_up_link" href="#">sign up</a>
            </p>
          </form>
        </div>
      </div>
    </section>
    <footer>
      <div id="footer"></div>
    </footer>
  </body>
</html>
